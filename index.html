<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last Line - Tactical Coop Shooter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d13;
      color: #edf2ff;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #gameContainer {
      width: 1280px;
      height: 720px;
      background: #111827;
      border: 2px solid #2e3c52;
      box-shadow: 0 0 25px rgba(110, 168, 255, 0.2);
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #121821;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    @media (max-width: 1400px) {
      #gameContainer { max-width: 100vw; max-height: 100vh; }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>
  <script src="src/config.js"></script>
  <script src="src/math.js"></script>
  <script src="src/input.js"></script>
  <script src="src/draw.js"></script>
  <script src="src/entity.js"></script>
  <script src="src/player.js"></script>
  <script src="src/enemy.js"></script>
  <script src="src/projectile.js"></script>
  <script src="src/pickup.js"></script>
  <script src="src/particle.js"></script>
  <script src="src/weapon.js"></script>
  <script src="src/mission.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
