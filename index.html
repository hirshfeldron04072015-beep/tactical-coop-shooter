<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last Line</title>
  <style>
    :root {
      --bg: #0b0d13;
      --panel: #141923;
      --panel2: #1b2330;
      --grid: rgba(255,255,255,0.05);
      --line: #2e3c52;
      --blue: #6ea8ff;
      --cyan: #68d8ff;
      --green: #59d38d;
      --red: #e86565;
      --yellow: #f3d66d;
      --orange: #ffb25f;
      --purple: #b98cff;
      --white: #edf2ff;
      --light: #c7d5ef;
      --dark: #111827;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      display: block;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      background: #121821;
      border: 2px solid var(--line);
      box-shadow: 0 0 25px rgba(110, 168, 255, 0.2);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1280" height="720"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const COLORS = {
      BLACK: [10,10,14],
      DARK: [27,28,35],
      DARKER: [18,18,26],
      MID: [54,60,74],
      LIGHT: [195,203,216],
      WHITE: [255,255,255],
      RED: [214,82,82],
      GREEN: [92,192,122],
      BLUE: [101,148,250],
      ORANGE: [255,166,77],
      YELLOW: [240,210,90],
      PURPLE: [162,122,255],
      CYAN: [104,216,255]
    };

    const WEAPONS = {
      primary: {
        "Pulse Rifle": { slot: "primary", damage: 14, firerate: 0.12, speed: 12, spread: 0.08, color: COLORS.BLUE, unlockKey: 0, desc: "Reliable standard rifle." },
        "Shard Carbine": { slot: "primary", damage: 18, firerate: 0.15, speed: 11, spread: 0.10, color: COLORS.PURPLE, unlockKey: 15, desc: "High damage rifle." },
        "Plasma SMG": { slot: "primary", damage: 12, firerate: 0.07, speed: 13, spread: 0.12, color: COLORS.ORANGE, unlockKey: 30, desc: "Fast automatic weapon." },
        "Scatter Shot": { slot: "primary", damage: 10, firerate: 0.45, speed: 10, spread: 0.4, color: COLORS.YELLOW, unlockKey: 45, desc: "Wide spread blast." },
        "Rail Gun": { slot: "primary", damage: 28, firerate: 0.30, speed: 16, spread: 0.02, color: COLORS.CYAN, unlockKey: 60, desc: "High power rifle." }
      },
      secondary: {
        "Guardian Pistol": { slot: "secondary", damage: 20, firerate: 0.25, speed: 14, spread: 0.04, color: COLORS.BLUE, unlockKey: 0, desc: "Stable sidearm." },
        "Volt Revolver": { slot: "secondary", damage: 26, firerate: 0.32, speed: 13, spread: 0.06, color: COLORS.YELLOW, unlockKey: 18, desc: "Heavy revolver." },
        "Arc Launcher": { slot: "secondary", damage: 34, firerate: 0.6, speed: 11, spread: 0.08, color: COLORS.ORANGE, unlockKey: 35, desc: "Explosive blast weapon." },
        "Plasma Pistol": { slot: "secondary", damage: 22, firerate: 0.20, speed: 15, spread: 0.05, color: [200,100,255], unlockKey: 50, desc: "Energy sidearm." }
      },
      melee: {
        "Combat Knife": { slot: "melee", damage: 32, firerate: 0.52, speed: 0, spread: 0, color: COLORS.WHITE, unlockKey: 0, desc: "Reliable melee attack." },
        "Shock Saber": { slot: "melee", damage: 44, firerate: 0.42, speed: 0, spread: 0, color: COLORS.PURPLE, unlockKey: 20, desc: "Faster shock blade." },
        "Breaker Axe": { slot: "melee", damage: 58, firerate: 0.7, speed: 0, spread: 0, color: COLORS.RED, unlockKey: 40, desc: "Heavy damage melee." },
        "Plasma Cutter": { slot: "melee", damage: 50, firerate: 0.45, speed: 0, spread: 0, color: [255,100,200], unlockKey: 70, desc: "Energy melee weapon." }
      },
      utility: {
        "Field Medkit": { slot: "utility", damage: 0, firerate: 0.0, speed: 0, spread: 0, color: COLORS.GREEN, unlockKey: 0, desc: "Heal 28 HP." },
        "Smoke Bomb": { slot: "utility", damage: 0, firerate: 0.0, speed: 0, spread: 0, color: COLORS.MID, unlockKey: 14, desc: "Disorient enemies." },
        "Shock Mine": { slot: "utility", damage: 20, firerate: 0.0, speed: 0, spread: 0, color: COLORS.BLUE, unlockKey: 26, desc: "Damage nearby enemies." },
        "Dash Core": { slot: "utility", damage: 0, firerate: 0.0, speed: 0, spread: 0, color: COLORS.ORANGE, unlockKey: 38, desc: "Short dash in aim direction." },
        "Force Shield": { slot: "utility", damage: 0, firerate: 0.0, speed: 0, spread: 0, color: COLORS.CYAN, unlockKey: 55, desc: "Temporary shield." }
      }
    };

    const MAPS = [
      { name: "Rift District", unlockLevel: 1, difficulty: 1, desc: "Starter district." },
      { name: "Thermal Docks", unlockLevel: 2, difficulty: 2, desc: "More enemies, harsher lanes." },
      { name: "Ashline Ruins", unlockLevel: 3, difficulty: 3, desc: "Tougher swarms." },
      { name: "The Null Coast", unlockLevel: 4, difficulty: 4, desc: "High-pressure combat." },
      { name: "Hollow Breach", unlockLevel: 5, difficulty: 5, desc: "Very hard mode." },
      { name: "Void Station", unlockLevel: 8, difficulty: 6, desc: "Endgame challenge." }
    ];

    const MISSIONS = [
      { title: "Sweep the Gate", type: "kills", target: 12, rewardKeys: 3, rewardXp: 90 },
      { title: "Escort the Relic", type: "time", target: 35, rewardKeys: 5, rewardXp: 130 },
      { title: "Hunt the Warden", type: "boss", target: 1, rewardKeys: 7, rewardXp: 180 },
      { title: "Signal Recovery", type: "kills", target: 18, rewardKeys: 5, rewardXp: 140 },
      { title: "Last Stand", type: "survive", target: 50, rewardKeys: 8, rewardXp: 200 },
      { title: "Void Walker", type: "kills", target: 25, rewardKeys: 10, rewardXp: 250 }
    ];

    const STARTER_LOADOUT = {
      primary: "Pulse Rifle",
      secondary: "Guardian Pistol",
      melee: "Combat Knife",
      utility: "Field Medkit"
    };

    const keys = {};
    const mouse = { x: WIDTH/2, y: HEIGHT/2, down: false };

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randInt(min, max) {
      return Math.floor(rand(min, max + 1));
    }

    function rgb(arr) {
      return `rgb(${arr[0]}, ${arr[1]}, ${arr[2]})`;
    }

    function rgba(arr, a) {
      return `rgba(${arr[0]}, ${arr[1]}, ${arr[2]}, ${a})`;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function getLevelThreshold(level) {
      return 120 + (level - 1) * 80;
    }

    class Bullet {
      constructor(x, y, angle, damage, speed, color, radius = 5, life = 90) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.damage = damage;
        this.speed = speed;
        this.color = color;
        this.radius = radius;
        this.life = life;
      }

      update(dt) {
        this.x += Math.cos(this.angle) * this.speed * dt * 60;
        this.y += Math.sin(this.angle) * this.speed * dt * 60;
        this.life -= dt * 60;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(this.color);
        ctx.fill();
      }

      alive() {
        return this.life > 0 && this.x > -30 && this.x < WIDTH + 30 && this.y > -30 && this.y < HEIGHT + 30;
      }
    }

    class Particle {
      constructor(x, y, color, vx, vy, life, size = 3) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.size = size;
      }

      update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.life -= dt * 60;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = rgb(this.color);
        ctx.fill();
      }
    }

    class Pickup {
      constructor(x, y, kind) {
        this.x = x;
        this.y = y;
        this.kind = kind;
        this.radius = 10;
        this.phase = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.phase += dt * 3;
      }

      draw() {
        let color = COLORS.BLUE;
        if (this.kind === "xp") color = COLORS.GREEN;
        if (this.kind === "key") color = COLORS.YELLOW;
        const bob = Math.sin(this.phase) * 4;
        ctx.beginPath();
        ctx.arc(this.x, this.y + bob, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(color);
        ctx.fill();
      }
    }

    class Enemy {
      constructor(x, y, radius, speed, hp, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.speed = speed;
        this.hp = hp;
        this.maxHp = hp;
        this.color = color;
        this.hitFlash = 0;
      }

      update(target, dt) {
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const d = Math.max(1, Math.hypot(dx, dy));
        this.x += (dx / d) * this.speed * dt * 60;
        this.y += (dy / d) * this.speed * dt * 60;
        this.hitFlash = Math.max(0, this.hitFlash - dt * 60);
      }

      takeDamage(amount) {
        this.hp -= amount;
        this.hitFlash = 12;
      }

      draw() {
        let color = this.color;
        if (this.hitFlash > 0) color = COLORS.WHITE;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(color);
        ctx.fill();

        const barW = this.radius * 2;
        const barH = 5;
        ctx.fillStyle = rgb(COLORS.BLACK);
        ctx.fillRect(this.x - this.radius, this.y - this.radius - 12, barW, barH);
        ctx.fillStyle = rgb(COLORS.RED);
        ctx.fillRect(this.x - this.radius, this.y - this.radius - 12, barW * clamp(this.hp / this.maxHp, 0, 1), barH);
      }
    }

    class Player {
      constructor(x, y, name = "Rook") {
        this.x = x;
        this.y = y;
        this.name = name;
        this.radius = 18;
        this.speed = 4.2;
        this.angle = 0;
        this.health = 100;
        this.maxHealth = 100;
        this.level = 1;
        this.xp = 0;
        this.keys = 0;
        this.kills = 0;
        this.inventory = { ...STARTER_LOADOUT };
        this.fireCooldown = 0;
        this.meleeCooldown = 0;
        this.utilityCooldown = 0;
        this.hitFlash = 0;
        this.shieldActive = false;
        this.shieldHealth = 0;
        this.shieldMaxHealth = 30;
      }

      move(dx, dy, dt) {
        const length = Math.hypot(dx, dy);
        if (length > 0) {
          dx /= length;
          dy /= length;
        }
        this.x += dx * this.speed * dt * 60;
        this.y += dy * this.speed * dt * 60;
        this.x = clamp(this.x, this.radius, WIDTH - this.radius);
        this.y = clamp(this.y, this.radius, HEIGHT - this.radius);
      }

      setAngleFromTarget(tx, ty) {
        this.angle = Math.atan2(ty - this.y, tx - this.x);
      }

      shoot(bullets) {
        if (this.fireCooldown > 0) return;
        const weaponName = this.inventory.primary;
        const data = WEAPONS.primary[weaponName];
        const spread = rand(-data.spread, data.spread);
        const ang = this.angle + spread;
        const x = this.x + Math.cos(ang) * (this.radius + 10);
        const y = this.y + Math.sin(ang) * (this.radius + 10);
        bullets.push(new Bullet(x, y, ang, data.damage, data.speed, data.color));
        this.fireCooldown = data.firerate * 60;
      }

      shootSecondary(bullets) {
        if (this.fireCooldown > 0) return;
        const weaponName = this.inventory.secondary;
        const data = WEAPONS.secondary[weaponName];
        const spread = rand(-data.spread, data.spread);
        const ang = this.angle + spread;
        const x = this.x + Math.cos(ang) * (this.radius + 12);
        const y = this.y + Math.sin(ang) * (this.radius + 12);
        bullets.push(new Bullet(x, y, ang, data.damage, data.speed, data.color, 6));
        this.fireCooldown = data.firerate * 60;
      }

      meleeAttack(enemies) {
        if (this.meleeCooldown > 0) return;
        const weaponName = this.inventory.melee;
        const damage = WEAPONS.melee[weaponName].damage;

        for (const enemy of enemies) {
          if (dist(this, enemy) < this.radius + enemy.radius + 28) {
            enemy.takeDamage(damage);
            this.meleeCooldown = WEAPONS.melee[weaponName].firerate * 60;
            return;
          }
        }
      }

      useUtility(particles, enemies) {
        if (this.utilityCooldown > 0) return;
        const kind = this.inventory.utility;

        if (kind === "Field Medkit") {
          this.health = Math.min(this.maxHealth, this.health + 28);
        } else if (kind === "Smoke Bomb") {
          for (let i = 0; i < 15; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = rand(1, 3);
            particles.push(new Particle(this.x, this.y, COLORS.MID, Math.cos(a) * s, Math.sin(a) * s, 35, 4));
          }
        } else if (kind === "Shock Mine") {
          for (const enemy of enemies) {
            if (dist(this, enemy) < 170) {
              enemy.takeDamage(18);
            }
          }
        } else if (kind === "Dash Core") {
          this.x += Math.cos(this.angle) * 55;
          this.y += Math.sin(this.angle) * 55;
          this.x = clamp(this.x, this.radius, WIDTH - this.radius);
          this.y = clamp(this.y, this.radius, HEIGHT - this.radius);
        } else if (kind === "Force Shield") {
          this.shieldActive = true;
          this.shieldHealth = this.shieldMaxHealth;
        }

        this.utilityCooldown = 220;
      }

      addXP(amount) {
        this.xp += amount;
        while (this.xp >= getLevelThreshold(this.level)) {
          this.xp -= getLevelThreshold(this.level);
          this.level += 1;
          this.maxHealth += 10;
          this.health = this.maxHealth;
          this.keys += 2;
        }
      }

      takeDamage(amount) {
        if (this.shieldActive && this.shieldHealth > 0) {
          const absorbed = Math.min(amount, this.shieldHealth);
          this.shieldHealth -= absorbed;
          amount -= absorbed;
        }
        this.health -= amount;
        this.hitFlash = 15;
      }

      update(dt) {
        this.fireCooldown = Math.max(0, this.fireCooldown - dt * 60);
        this.meleeCooldown = Math.max(0, this.meleeCooldown - dt * 60);
        this.utilityCooldown = Math.max(0, this.utilityCooldown - dt * 60);
        this.hitFlash = Math.max(0, this.hitFlash - dt * 60);

        if (this.shieldActive && this.shieldHealth <= 0) {
          this.shieldActive = false;
          this.shieldHealth = 0;
        }
      }

      draw() {
        if (this.shieldActive && this.shieldHealth > 0) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 12, 0, Math.PI * 2);
          ctx.strokeStyle = rgba(COLORS.BLUE, 0.5);
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        const col = this.hitFlash > 0 ? COLORS.WHITE : COLORS.BLUE;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(col);
        ctx.fill();

        const gunX = this.x + Math.cos(this.angle) * (this.radius + 18);
        const gunY = this.y + Math.sin(this.angle) * (this.radius + 18);

        ctx.strokeStyle = rgb(COLORS.LIGHT);
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(gunX, gunY);
        ctx.stroke();

        ctx.fillStyle = rgb(COLORS.WHITE);
        ctx.font = "14px Arial";
        ctx.textAlign = "center";
        ctx.fillText(this.name, this.x, this.y - 44);

        const bw = 60;
        const bh = 7;
        const bx = this.x - bw / 2;
        const by = this.y + this.radius + 12;

        ctx.fillStyle = rgb(COLORS.BLACK);
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = rgb(COLORS.GREEN);
        ctx.fillRect(bx, by, bw * clamp(this.health / this.maxHealth, 0, 1), bh);

        if (this.shieldActive && this.shieldHealth > 0) {
          ctx.fillStyle = rgb(COLORS.BLACK);
          ctx.fillRect(bx, by + 10, bw, bh);
          ctx.fillStyle = rgb(COLORS.BLUE);
          ctx.fillRect(bx, by + 10, bw * clamp(this.shieldHealth / this.shieldMaxHealth, 0, 1), bh);
        }
      }
    }

    class Game {
      constructor() {
        this.state = "menu"; // menu, lobby, playing, gameOver
        this.player = null;
        this.enemies = [];
        this.bullets = [];
        this.pickups = [];
        this.particles = [];

        this.mapName = MAPS[0].name;
        this.selectedMapIdx = 0;
        this.currentMission = 0;
        this.missionProgress = 0;
        this.missionStarted = true;
        this.gameTimer = 0;
        this.wave = 1;
        this.enemySpawnDelay = 50;
        this.message = "";
        this.messageTimer = 0;

        this.difficulty = 1;
      }

      setMessage(text, duration = 120) {
        this.message = text;
        this.messageTimer = duration;
      }

      startGame() {
        this.state = "playing";
        this.player = new Player(WIDTH / 2, HEIGHT / 2, "Rook");
        this.enemies = [];
        this.bullets = [];
        this.pickups = [];
        this.particles = [];

        this.currentMission = 0;
        this.missionProgress = 0;
        this.missionStarted = true;
        this.gameTimer = 0;
        this.wave = 1;
        this.enemySpawnDelay = 50;
        this.message = "";
        this.messageTimer = 0;

        this.spawnWave();
      }

      spawnWave() {
        const count = Math.min(5 + this.wave * 2, 25 + this.difficulty * 5);

        for (let i = 0; i < count; i++) {
          const side = ["top", "bottom", "left", "right"][randInt(0, 3)];
          let x = 0;
          let y = 0;

          if (side === "top") {
            x = rand(0, WIDTH);
            y = -30;
          } else if (side === "bottom") {
            x = rand(0, WIDTH);
            y = HEIGHT + 30;
          } else if (side === "left") {
            x = -30;
            y = rand(0, HEIGHT);
          } else {
            x = WIDTH + 30;
            y = rand(0, HEIGHT);
          }

          const radius = randInt(14, 20);
          const speed = rand(0.8, 1.5) + this.wave * 0.15 + this.difficulty * 0.1;
          const hp = randInt(22, 34) + this.wave * 4 + this.difficulty * 3;
          const color = [randInt(100, 220), randInt(50, 120), randInt(50, 120)];

          this.enemies.push(new Enemy(x, y, radius, speed, hp, color));
        }
      }

      spawnPickup(x, y, kind) {
        this.pickups.push(new Pickup(x, y, kind));
      }

      spawnParticles(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = rand(1, 3.5);
          this.particles.push(new Particle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed, rand(18, 40), randInt(2, 5)));
        }
      }

      completeMission(mission) {
        this.player.keys += mission.rewardKeys;
        this.player.addXP(mission.rewardXp);
        this.setMessage(`Mission complete: ${mission.title}`, 180);

        this.currentMission += 1;
        this.missionProgress = 0;
        this.missionStarted = this.currentMission < MISSIONS.length;
        this.wave += 1;
        this.spawnWave();
      }

      update(dt) {
        if (this.state !== "playing") return;

        this.gameTimer += dt;

        this.player.update(dt);

        const moveX = (keys["KeyD"] || keys["ArrowRight"] ? 1 : 0) - (keys["KeyA"] || keys["ArrowLeft"] ? 1 : 0);
        const moveY = (keys["KeyS"] || keys["ArrowDown"] ? 1 : 0) - (keys["KeyW"] || keys["ArrowUp"] ? 1 : 0);
        this.player.move(moveX, moveY, dt);
        this.player.setAngleFromTarget(mouse.x, mouse.y);

        if (mouse.down || keys["Space"]) {
          this.player.shoot(this.bullets);
        }
        if (keys["ShiftLeft"] || keys["ShiftRight"]) {
          this.player.shootSecondary(this.bullets);
        }
        if (keys["KeyF"]) {
          this.player.meleeAttack(this.enemies);
        }
        if (keys["KeyQ"]) {
          this.player.useUtility(this.particles, this.enemies);
        }

        // Enemy spawn delay
        this.enemySpawnDelay = Math.max(0, this.enemySpawnDelay - dt * 60);
        if (this.enemySpawnDelay <= 0) {
          this.spawnWave();
          this.enemySpawnDelay = Math.max(20, 100 - this.wave * 4 - this.difficulty * 5);
          this.wave += 1;
        }

        // Bullet updates
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const bullet = this.bullets[i];
          bullet.update(dt);

          if (!bullet.alive()) {
            this.bullets.splice(i, 1);
            continue;
          }

          let hit = false;
          for (let j = this.enemies.length - 1; j >= 0; j--) {
            const enemy = this.enemies[j];
            if (dist(bullet, enemy) < bullet.radius + enemy.radius) {
              enemy.takeDamage(bullet.damage);
              this.spawnParticles(bullet.x, bullet.y, bullet.color, 6);
              this.bullets.splice(i, 1);

              if (enemy.hp <= 0) {
                this.enemies.splice(j, 1);
                this.player.kills += 1;
                this.player.addXP(15);
                this.missionProgress += 1;

                if (Math.random() < 0.35) this.spawnPickup(enemy.x, enemy.y, "xp");
                if (Math.random() < 0.10) this.spawnPickup(enemy.x, enemy.y, "key");
              }

              hit = true;
              break;
            }
          }
          if (hit) continue;
        }

        // Enemy updates
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const enemy = this.enemies[i];
          enemy.update(this.player, dt);

          if (dist(this.player, enemy) < enemy.radius + this.player.radius) {
            this.player.takeDamage(14);
            enemy.hitFlash = 15;
            this.spawnParticles(this.player.x, this.player.y, COLORS.RED, 8);

            if (this.player.health <= 0) {
              this.state = "gameOver";
              this.setMessage("Mission failed.", 240);
            }
          }
        }

        // Pickups
        for (let i = this.pickups.length - 1; i >= 0; i--) {
          const pickup = this.pickups[i];
          pickup.update(dt);

          if (dist(this.player, pickup) < pickup.radius + this.player.radius + 8) {
            if (pickup.kind === "xp") {
              this.player.addXP(40);
              this.setMessage("+40 XP", 30);
            } else if (pickup.kind === "key") {
              this.player.keys += 1;
              this.setMessage("+1 key", 30);
            }
            this.pickups.splice(i, 1);
          }
        }

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].update(dt);
          if (this.particles[i].life <= 0) {
            this.particles.splice(i, 1);
          }
        }

        // Mission logic
        if (this.missionStarted && this.currentMission < MISSIONS.length) {
          const mission = MISSIONS[this.currentMission];
          let done = false;

          if (mission.type === "kills" && this.missionProgress >= mission.target) {
            done = true;
          } else if (mission.type === "time" && this.gameTimer >= mission.target) {
            done = true;
          } else if (mission.type === "survive" && this.gameTimer >= mission.target) {
            done = true;
          } else if (mission.type === "boss" && this.missionProgress >= mission.target) {
            done = true;
          }

          if (done) this.completeMission(mission);
        }

        // If no enemies left, spawn more
        if (this.enemies.length === 0 && this.state === "playing") {
          this.wave += 1;
          this.spawnWave();
        }

        if (this.messageTimer > 0) {
          this.messageTimer -= dt * 60;
          if (this.messageTimer <= 0) this.message = "";
        }
      }

      drawBackground() {
        ctx.fillStyle = rgb(COLORS.DARK);
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        ctx.lineWidth = 1;

        for (let x = 0; x < WIDTH; x += 50) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, HEIGHT);
          ctx.stroke();
        }
        for (let y = 0; y < HEIGHT; y += 50) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }
      }

      drawMenu() {
        this.drawBackground();

        ctx.textAlign = "center";
        ctx.fillStyle = rgb(COLORS.WHITE);
        ctx.font = "bold 52px Arial";
        ctx.fillText("LAST LINE", WIDTH / 2, 110);

        ctx.fillStyle = rgb(COLORS.LIGHT);
        ctx.font = "20px Arial";
        ctx.fillText("Tactical Coop Shooter", WIDTH / 2, 150);

        const lines = [
          "1. Create Party",
          "2. Join Party",
          "3. Start Solo",
          "",
          "Controls:",
          "WASD move",
          "Mouse aim",
          "Left click / Space shoot",
          "Shift secondary fire",
          "F melee",
          "Q utility",
          "Esc quit"
        ];

        let y = 220;
        ctx.textAlign = "left";
        ctx.font = "22px Arial";
        for (const line of lines) {
          if (line === "") { y += 15; continue; }
          ctx.fillStyle = rgb(COLORS.LIGHT);
          ctx.fillText(line, 260, y);
          y += 32;
        }

        if (this.message) {
          ctx.fillStyle = rgb(COLORS.YELLOW);
          ctx.font = "18px Arial";
          ctx.textAlign = "center";
          ctx.fillText(this.message, WIDTH / 2, 640);
        }
      }

      drawLobby() {
        this.drawBackground();

        ctx.textAlign = "center";
        ctx.fillStyle = rgb(COLORS.WHITE);
        ctx.font = "bold 42px Arial";
        ctx.fillText("LOBBY", WIDTH / 2, 80);

        ctx.fillStyle = rgb(COLORS.GREEN);
        ctx.font = "24px Arial";
        ctx.fillText(`Party Code: ${this.mapName || "NO CODE"}`, WIDTH / 2, 140);

        // map list
        ctx.textAlign = "left";
        ctx.font = "20px Arial";
        for (let i = 0; i < MAPS.length; i++) {
          const map = MAPS[i];
          const selected = i === this.selectedMapIdx;
          ctx.fillStyle = selected ? rgb(COLORS.GREEN) : rgb(COLORS.LIGHT);
          ctx.fillText(`${selected ? "> " : "  "}${i + 1}. ${map.name}   (Unlock Lv ${map.unlockLevel})`, 220, 220 + i * 35);
        }

        ctx.textAlign = "center";
        ctx.fillStyle = rgb(COLORS.YELLOW);
        ctx.font = "18px Arial";
        ctx.fillText("Press Enter to deploy", WIDTH / 2, 660);
      }

      drawGame() {
        this.drawBackground();

        for (const bullet of this.bullets) bullet.draw();
        for (const pickup of this.pickups) pickup.draw();
        for (const enemy of this.enemies) enemy.draw();
        for (const p of this.particles) p.draw();
        this.player.draw();

        // HUD
        ctx.textAlign = "left";
        ctx.fillStyle = rgb(COLORS.WHITE);
        ctx.font = "20px Arial";
        ctx.fillText(`HP: ${Math.floor(this.player.health)}/${this.player.maxHealth}`, 20, 25);
        ctx.fillText(`LV ${this.player.level} • XP ${this.player.xp}/${getLevelThreshold(this.player.level)}`, 20, 50);
        ctx.fillText(`Keys: ${this.player.keys} | Kills: ${this.player.kills}`, 20, 75);

        ctx.fillStyle = rgb(COLORS.LIGHT);
        ctx.fillText(`Map: ${this.mapName}`, WIDTH - 260, 25);
        ctx.fillText(`Wave: ${this.wave}`, WIDTH - 260, 50);
        ctx.fillText(`Enemies: ${this.enemies.length}`, WIDTH - 260, 75);

        ctx.fillStyle = rgb(COLORS.BLUE);
        ctx.fillText(`Primary: ${this.player.inventory.primary}`, 20, 105);
        ctx.fillText(`Secondary: ${this.player.inventory.secondary}`, 20, 130);

        if (this.currentMission < MISSIONS.length) {
          const mission = MISSIONS[this.currentMission];
          ctx.fillStyle = rgb(COLORS.ORANGE);
          ctx.font = "bold 20px Arial";
          ctx.fillText(`Mission: ${mission.title}`, 20, HEIGHT - 90);
          ctx.fillStyle = rgb(COLORS.LIGHT);
          ctx.font = "20px Arial";
          ctx.fillText(`Progress: ${this.missionProgress}/${mission.target}`, 20, HEIGHT - 60);
        } else {
          ctx.fillStyle = rgb(COLORS.GREEN);
          ctx.font = "bold 28px Arial";
          ctx.textAlign = "center";
          ctx.fillText("All missions complete", WIDTH / 2, HEIGHT - 80);
        }

        if (this.message) {
          ctx.textAlign = "center";
          ctx.fillStyle = rgb(COLORS.YELLOW);
          ctx.font = "18px Arial";
          ctx.fillText(this.message, WIDTH / 2, HEIGHT - 30);
        }
      }

      drawGameOver() {
        this.drawBackground();

        ctx.textAlign = "center";
        ctx.fillStyle = rgb(COLORS.RED);
        ctx.font = "bold 52px Arial";
        ctx.fillText("MISSION FAILED", WIDTH / 2, 180);

        ctx.fillStyle = rgb(COLORS.WHITE);
        ctx.font = "24px Arial";
        ctx.fillText(`Wave: ${this.wave}`, WIDTH / 2, 260);
        ctx.fillText(`Level: ${this.player.level}`, WIDTH / 2, 300);
        ctx.fillText(`Kills: ${this.player.kills}`, WIDTH / 2, 340);
        ctx.fillText(`Keys: ${this.player.keys}`, WIDTH / 2, 380);
        ctx.fillText(`Time: ${Math.floor(this.gameTimer)}s`, WIDTH / 2, 420);

        ctx.fillStyle = rgb(COLORS.LIGHT);
        ctx.font = "20px Arial";
        ctx.fillText("Press R to restart or Esc to menu", WIDTH / 2, 520);
      }

      draw() {
        if (this.state === "menu") this.drawMenu();
        else if (this.state === "lobby") this.drawLobby();
        else if (this.state === "playing") this.drawGame();
        else if (this.state === "gameOver") this.drawGameOver();
      }
    }

    const game = new Game();

    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;

      if (e.code === "Digit1" && game.state === "menu") {
        game.state = "lobby";
        game.selectedMapIdx = 0;
        game.mapName = MAPS[0].name;
        game.difficulty = MAPS[0].difficulty;
      } else if (e.code === "Digit2" && game.state === "menu") {
        game.state = "lobby";
        game.selectedMapIdx = 0;
        game.mapName = MAPS[0].name;
        game.difficulty = MAPS[0].difficulty;
      } else if (e.code === "Digit3" && game.state === "menu") {
        game.state = "playing";
        game.startGame();
      }

      if (game.state === "menu" && e.code === "Enter") {
        game.startGame();
      }

      if (game.state === "lobby" && e.code === "ArrowUp") {
        game.selectedMapIdx = Math.max(0, game.selectedMapIdx - 1);
        game.mapName = MAPS[game.selectedMapIdx].name;
        game.difficulty = MAPS[game.selectedMapIdx].difficulty;
      }

      if (game.state === "lobby" && e.code === "ArrowDown") {
        game.selectedMapIdx = Math.min(MAPS.length - 1, game.selectedMapIdx + 1);
        game.mapName = MAPS[game.selectedMapIdx].name;
        game.difficulty = MAPS[game.selectedMapIdx].difficulty;
      }

      if (game.state === "lobby" && e.code === "Enter") {
        game.startGame();
      }

      if (game.state === "gameOver" && e.code === "KeyR") {
        game.startGame();
      }
      if (game.state === "gameOver" && e.code === "Escape") {
        game.state = "menu";
      }

      if (game.state === "playing" && e.code === "Escape") {
        game.state = "menu";
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      mouse.x = (e.clientX - rect.left) * scaleX;
      mouse.y = (e.clientY - rect.top) * scaleY;
    });

    canvas.addEventListener("mousedown", () => {
      mouse.down = true;
    });

    window.addEventListener("mouseup", () => {
      mouse.down = false;
    });

    let last = 0;
    function loop(ts) {
      const dt = Math.min((ts - last) / 1000 || 0.016, 0.033);
      last = ts;

      game.update(dt);
      game.draw();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
