<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last Line - Tactical Coop Shooter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0e;
      color: #ffffff;
      font-family: "Arial", sans-serif;
      overflow: hidden;
    }

    #gameContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
    }

    canvas {
      display: block;
      background: #1b1d2a;
      border: 3px solid #3b82f6;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.5), inset 0 0 30px rgba(59, 130, 246, 0.1);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    @media (max-width: 1400px) {
      canvas {
        max-width: 100vw;
        max-height: 100vh;
      }
    }

    /* Loading screen */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 14, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      font-size: 24px;
      color: #3b82f6;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #3b82f6;
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>
  <div id="loadingScreen" style="display: none;">
    <div class="loading-spinner"></div>
    <div>Loading Last Line...</div>
  </div>

  <script>
    // ===================================================================
    // LAST LINE - FULL GAME ENGINE (JavaScript)
    // ===================================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    // ===================================================================
    // COLOR PALETTE
    // ===================================================================

    const COLORS = {
      BLACK: [10, 10, 14],
      DARK: [27, 28, 35],
      DARKER: [18, 18, 26],
      MID: [54, 60, 74],
      LIGHT: [195, 203, 216],
      WHITE: [255, 255, 255],
      RED: [214, 82, 82],
      GREEN: [92, 192, 122],
      BLUE: [101, 148, 250],
      ORANGE: [255, 166, 77],
      YELLOW: [240, 210, 90],
      PURPLE: [162, 122, 255],
    };

    // ===================================================================
    // WEAPON DATA SYSTEM
    // ===================================================================

    const WEAPONS = {
      primary: {
        "Pulse Rifle": {
          slot: "primary",
          damage: 14,
          firerate: 0.12,
          speed: 12,
          spread: 0.08,
          color: COLORS.BLUE,
          unlockKey: 0,
          description: "Standard issue rifle. Reliable and quick."
        },
        "Shard Carbine": {
          slot: "primary",
          damage: 18,

          speed: 11,
          spread: 0.10,
          color: COLORS.PURPLE,
          unlockKey: 15,
          description: "Higher damage, slower fire rate."
        },
        "Plasma SMG": {
          slot: "primary",
          damage: 12,

        },

        },
        "Rail Gun": {
          slot: "primary",

          spread: 0.02,

          unlockKey: 60,
          description: "High velocity, high damage sniper."
        }
      },
      secondary: {
        "Guardian Pistol": {
          slot: "secondary",
          damage: 20,
          firerate: 0.25,
          speed: 14,
          spread: 0.04,
          color: COLORS.BLUE,
          unlockKey: 0,
          description: "Solid sidearm. Never fails."
        },
        "Volt Revolver": {
          slot: "secondary",
          damage: 26,
          firerate: 0.32,
          speed: 13,
          spread: 0.06,
          color: COLORS.YELLOW,
          unlockKey: 18,
          description: "High damage revolver."
        },
        "Arc Launcher": {
          slot: "secondary",
          damage: 34,
          firerate: 0.6,
          speed: 11,
          spread: 0.08,
          color: COLORS.ORANGE,
          unlockKey: 35,
          description: "Explosive launcher. AOE damage."
        },
        "Plasma Pistol": {
          slot: "secondary",
          damage: 22,
          firerate: 0.2,
          speed: 15,
          spread: 0.05,
          color: [200, 100, 255],
          unlockKey: 50,
          description: "Sustained energy weapon."
        }
      },
      melee: {
        "Combat Knife": {
          slot: "melee",
          damage: 32,
          firerate: 0.52,
          speed: 0,
          spread: 0,
          color: COLORS.WHITE,
          unlockKey: 0,
          description: "Quick, reliable blade."
        },
        "Shock Saber": {
          slot: "melee",
          damage: 44,
          firerate: 0.42,
          speed: 0,
          spread: 0,
          color: COLORS.PURPLE,
          unlockKey: 20,
          description: "Electrified blade. Faster swings."
        },
        "Breaker Axe": {
          slot: "melee",
          damage: 58,
          firerate: 0.7,
          speed: 0,
          spread: 0,
          color: COLORS.RED,
          unlockKey: 40,
          description: "Massive damage, slow wind-up."
        },
        "Plasma Cutter": {
          slot: "melee",
          damage: 50,
          firerate: 0.45,
          speed: 0,
          spread: 0,
          color: [255, 100, 200],
          unlockKey: 70,
          description: "Energy melee weapon."
        }
      },
      utility: {
        "Field Medkit": {
          slot: "utility",
          damage: 0,
          firerate: 0.0,
          speed: 0,
          spread: 0,
          color: COLORS.GREEN,
          unlockKey: 0,
          description: "Heal 28 HP. Recharge: 220ms"
        },
        "Smoke Bomb": {
          slot: "utility",
          damage: 0,
          firerate: 0.0,
          speed: 0,
          spread: 0,
          color: COLORS.MID,
          unlockKey: 14,
          description: "Visual cover. Obscures enemies."
        },
        "Shock Mine": {
          slot: "utility",
          damage: 20,
          firerate: 0.0,
          speed: 0,
          spread: 0,
          color: COLORS.BLUE,
          unlockKey: 26,
          description: "Area denial. Damages nearby."
        },
        "Dash Core": {
          slot: "utility",
          damage: 0,
          firerate: 0.0,
          speed: 0,
          spread: 0,
          color: COLORS.ORANGE,
          unlockKey: 38,
          description: "Dash 55px in aim direction."
        },
        "Force Shield": {
          slot: "utility",
          damage: 0,
          firerate: 0.0,
          speed: 0,
          spread: 0,
          color: [100, 150, 255],
          unlockKey: 55,
          description: "Temporary protective barrier."
        }
      }
    };

    // ===================================================================
    // MAPS
    // ===================================================================

    const MAPS = [
      { name: "Rift District", unlockLevel: 1, difficulty: 1, description: "Start here. Moderate enemy density." },
      { name: "Thermal Docks", unlockLevel: 2, difficulty: 2, description: "Faster enemies. More waves." },
      { name: "Ashline Ruins", unlockLevel: 3, difficulty: 3, description: "Dangerous terrain. Tough enemies." },
      { name: "The Null Coast", unlockLevel: 4, difficulty: 4, description: "Extreme difficulty. High rewards." },
      { name: "Hollow Breach", unlockLevel: 5, difficulty: 5, description: "Nightmare mode. Ultimate challenge." },
      { name: "Void Station", unlockLevel: 8, difficulty: 6, description: "Endless waves. True endgame." }
    ];

    // ===================================================================
    // MISSIONS
    // ===================================================================

    const MISSIONS = [
      { title: "Sweep the Gate", type: "kills", target: 12, rewardKeys: 3, rewardXp: 90 },
      { title: "Escort the Relic", type: "time", target: 35, rewardKeys: 5, rewardXp: 130 },
      { title: "Hunt the Warden", type: "boss", target: 1, rewardKeys: 7, rewardXp: 180 },
      { title: "Signal Recovery", type: "kills", target: 18, rewardKeys: 5, rewardXp: 140 },
      { title: "Last Stand", type: "survive", target: 50, rewardKeys: 8, rewardXp: 200 },
      { title: "Void Walker", type: "kills", target: 25, rewardKeys: 10, rewardXp: 250 },
      { title: "The Final Push", type: "survive", target: 90, rewardKeys: 15, rewardXp: 400 }
    ];

    const STARTER_LOADOUT = {
      primary: "Pulse Rifle",
      secondary: "Guardian Pistol",
      melee: "Combat Knife",
      utility: "Field Medkit"
    };

    // ===================================================================
    // UTILITY FUNCTIONS
    // ===================================================================

    function clamp(value, low, high) {
      return Math.max(low, Math.min(high, value));
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function distanceXY(x1, y1, x2, y2) {
      return Math.hypot(x1 - x2, y1 - y2);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randInt(min, max) {
      return Math.floor(rand(min, max + 1));
    }

    function rgb(arr) {
      return `rgb(${arr[0]},${arr[1]},${arr[2]})`;
    }

    function rgba(arr, a) {
      return `rgba(${arr[0]},${arr[1]},${arr[2]},${a})`;
    }

    function generatePartyCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "";
      for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function getLevelThreshold(level) {
      return 120 + (level - 1) * 80;
    }

    function getUnlockedWeapons(player) {
      const result = {};
      for (const slot in WEAPONS) {
        result[slot] = [];
        for (const name in WEAPONS[slot]) {
          const data = WEAPONS[slot][name];
          if (data.unlockKey <= player.keys || Object.values(STARTER_LOADOUT).includes(name)) {
            result[slot].push(name);
          }
        }
      }
      return result;
    }

    // ===================================================================
    // DRAWING UTILITIES
    // ===================================================================

    function drawRect(x, y, w, h, color, stroke = false, lineWidth = 1) {
      ctx.fillStyle = rgb(color);
      if (stroke) {
        ctx.strokeStyle = rgb(color);
        ctx.lineWidth = lineWidth;
        ctx.strokeRect(x, y, w, h);
      } else {
        ctx.fillRect(x, y, w, h);
      }
    }

    function drawCircle(x, y, radius, color, stroke = false, lineWidth = 1) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      if (stroke) {
        ctx.strokeStyle = rgb(color);
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      } else {
        ctx.fillStyle = rgb(color);
        ctx.fill();
      }
    }

    function drawLine(x1, y1, x2, y2, color, lineWidth = 1) {
      ctx.strokeStyle = rgb(color);
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawText(text, x, y, color, fontSize = 16, bold = false, align = "left") {
      ctx.fillStyle = rgb(color);
      ctx.font = `${bold ? "bold " : ""}${fontSize}px Arial`;
      ctx.textAlign = align;
      ctx.fillText(text, x, y);
    }

    function drawCenteredText(text, x, y, color, fontSize = 16, bold = false) {
      ctx.fillStyle = rgb(color);
      ctx.font = `${bold ? "bold " : ""}${fontSize}px Arial`;
      ctx.textAlign = "center";
      ctx.fillText(text, x, y);
    }

    // ===================================================================
    // ENTITY CLASSES
    // ===================================================================

    class Bullet {
      constructor(x, y, angle, damage, speed, color, radius = 5, life = 90) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.damage = damage;
        this.speed = speed;
        this.color = color;
        this.radius = radius;
        this.life = life;
      }

      update(dt) {
        this.x += Math.cos(this.angle) * this.speed * dt * 60;
        this.y += Math.sin(this.angle) * this.speed * dt * 60;
        this.life -= dt * 60;
      }

      draw() {
        drawCircle(this.x, this.y, this.radius, this.color);
      }

      isAlive() {
        return this.life > 0 && this.x > -50 && this.x < WIDTH + 50 && this.y > -50 && this.y < HEIGHT + 50;
      }
    }

    class Particle {
      constructor(x, y, color, vx, vy, life, size = 3) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.size = size;
      }

      update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.life -= dt * 60;
      }

      draw() {
        drawCircle(this.x, this.y, this.size, this.color);
      }

      isAlive() {
        return this.life > 0;
      }
    }

    class Pickup {
      constructor(x, y, kind) {
        this.x = x;
        this.y = y;
        this.kind = kind;
        this.radius = 10;
        this.phase = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.phase += dt * 3;
      }

      draw() {
        const color = this.kind === "xp" ? COLORS.GREEN : this.kind === "key" ? COLORS.YELLOW : COLORS.BLUE;
        const bob = Math.sin(this.phase) * 4;
        drawCircle(this.x, this.y + bob, this.radius, color);
      }
    }

    class Enemy {
      constructor(x, y, radius, speed, hp, color, wave) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.speed = speed;
        this.hp = hp;
        this.maxHp = hp;
        this.color = color;
        this.hitFlash = 0;
        this.wave = wave;
      }

      update(target, dt) {
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const d = Math.max(1, Math.hypot(dx, dy));
        this.x += (dx / d) * this.speed * dt * 60;
        this.y += (dy / d) * this.speed * dt * 60;
        this.hitFlash = Math.max(0, this.hitFlash - dt * 60);
      }

      draw() {
        let color = this.color;
        if (this.hitFlash > 0) {
          color = COLORS.WHITE;
        }
        drawCircle(this.x, this.y, this.radius, color);

        // HP bar
        const barW = this.radius * 2;
        const barH = 5;
        drawRect(this.x - this.radius, this.y - this.radius - 12, barW, barH, COLORS.BLACK);
        drawRect(this.x - this.radius, this.y - this.radius - 12, barW * clamp(this.hp / this.maxHp, 0, 1), barH, COLORS.RED);
      }

      takeDamage(amount) {
        this.hp -= amount;
        this.hitFlash = 10;
      }

      isAlive() {
        return this.hp > 0;
      }
    }

    class Player {
      constructor(x, y, name = "Rook") {
        this.x = x;
        this.y = y;
        this.name = name;
        this.radius = 18;
        this.speed = 4.2;
        this.angle = 0;
        this.health = 100;
        this.maxHealth = 100;
        this.level = 1;
        this.xp = 0;
        this.keys = 0;
        this.inventory = { ...STARTER_LOADOUT };
        this.fireCooldown = 0;
        this.meleeCooldown = 0;
        this.utilityCooldown = 0;
        this.hitFlash = 0;
        this.shieldActive = false;
        this.shieldHealth = 0;
        this.shieldMaxHealth = 30;
        this.kills = 0;
        this.totalDamageDealt = 0;
      }

      move(dx, dy, dt) {
        const length = Math.hypot(dx, dy);
        if (length > 0) {
          dx /= length;
          dy /= length;
        }
        this.x += dx * this.speed * dt * 60;
        this.y += dy * this.speed * dt * 60;
        this.x = clamp(this.x, this.radius, WIDTH - this.radius);
        this.y = clamp(this.y, this.radius, HEIGHT - this.radius);
      }

      setAngleFromTarget(tx, ty) {
        this.angle = Math.atan2(ty - this.y, tx - this.x);
      }

      shoot(bullets) {
        if (this.fireCooldown > 0) return;
        const weaponName = this.inventory.primary;
        const data = WEAPONS.primary[weaponName];
        const spread = rand(-data.spread, data.spread);
        const ang = this.angle + spread;
        const x = this.x + Math.cos(ang) * (this.radius + 10);
        const y = this.y + Math.sin(ang) * (this.radius + 10);
        bullets.push(new Bullet(x, y, ang, data.damage, data.speed, data.color));
        this.fireCooldown = data.firerate * 60;
      }

      shootSecondary(bullets) {
        if (this.fireCooldown > 0) return;
        const weaponName = this.inventory.secondary;
        const data = WEAPONS.secondary[weaponName];
        const spread = rand(-data.spread, data.spread);
        const ang = this.angle + spread;
        const x = this.x + Math.cos(ang) * (this.radius + 12);
        const y = this.y + Math.sin(ang) * (this.radius + 12);
        bullets.push(new Bullet(x, y, ang, data.damage, data.speed, data.color, 6));
        this.fireCooldown = data.firerate * 60;
      }

      meleeAttack(enemies) {
        if (this.meleeCooldown > 0) return;
        const weaponName = this.inventory.melee;
        const damage = WEAPONS.melee[weaponName].damage;
        for (const enemy of enemies) {
          const d = distance(this, enemy);
          if (d < this.radius + enemy.radius + 28) {
            enemy.takeDamage(damage);
            this.totalDamageDealt += damage;
            this.meleeCooldown = WEAPONS.melee[weaponName].firerate * 60;
            return;
          }
        }
      }

      useUtility(particles, enemies) {
        if (this.utilityCooldown > 0) return;
        const kind = this.inventory.utility;
        if (kind === "Field Medkit") {
          this.health = Math.min(this.maxHealth, this.health + 28);
        } else if (kind === "Smoke Bomb") {
          for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = rand(1, 3);
            particles.push(new Particle(this.x, this.y, COLORS.MID, Math.cos(angle) * speed, Math.sin(angle) * speed, 40, 4));
          }
        } else if (kind === "Shock Mine") {
          for (const enemy of enemies) {
            const d = distance(this, enemy);
            if (d < 170) {
              enemy.takeDamage(18);
              this.totalDamageDealt += 18;
            }
          }
        } else if (kind === "Dash Core") {
          this.x += Math.cos(this.angle) * 55;
          this.y += Math.sin(this.angle) * 55;
          this.x = clamp(this.x, this.radius, WIDTH - this.radius);
          this.y = clamp(this.y, this.radius, HEIGHT - this.radius);
        } else if (kind === "Force Shield") {
          this.shieldActive = true;
          this.shieldHealth = this.shieldMaxHealth;
        }
        this.utilityCooldown = 220;
      }

      addXP(amount) {
        this.xp += amount;
        const threshold = getLevelThreshold(this.level);
        while (this.xp >= threshold) {
          this.xp -= threshold;
          this.level += 1;
          this.maxHealth += 10;
          this.health = this.maxHealth;
          this.keys += 2;
        }
      }

      takeDamage(amount) {
        if (this.shieldActive && this.shieldHealth > 0) {
          const shieldDamage = Math.min(amount, this.shieldHealth);
          this.shieldHealth -= shieldDamage;
          amount -= shieldDamage;
        }
        this.health -= amount;
        this.hitFlash = 15;
      }

      draw() {
        // Shield
        if (this.shieldActive && this.shieldHealth > 0) {
          ctx.strokeStyle = rgba(COLORS.BLUE, 0.5);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 12, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Body
        const color = this.hitFlash > 0 ? COLORS.WHITE : COLORS.BLUE;
        drawCircle(this.x, this.y, this.radius, color);

        // Gun direction
        const gunX = this.x + Math.cos(this.angle) * (this.radius + 18);
        const gunY = this.y + Math.sin(this.angle) * (this.radius + 18);
        drawLine(this.x, this.y, gunX, gunY, COLORS.LIGHT, 4);

        // Name
        drawText(this.name, this.x - 24, this.y - 44, COLORS.WHITE, 14);

        // Health bar
        const barW = 60;
        const barH = 7;
        const bx = this.x - barW / 2;
        const by = this.y + this.radius + 12;
        drawRect(bx, by, barW, barH, COLORS.BLACK);
        drawRect(bx, by, barW * clamp(this.health / this.maxHealth, 0, 1), barH, COLORS.GREEN);

        // Shield bar
        if (this.shieldActive && this.shieldHealth > 0) {
          drawRect(bx, by + 10, barW, barH, COLORS.BLACK);
          drawRect(bx, by + 10, barW * clamp(this.shieldHealth / this.shieldMaxHealth, 0, 1), barH, COLORS.BLUE);
        }
      }

      update(dt) {
        this.fireCooldown = Math.max(0, this.fireCooldown - dt * 60);
        this.meleeCooldown = Math.max(0, this.meleeCooldown - dt * 60);
        this.utilityCooldown = Math.max(0, this.utilityCooldown - dt * 60);
        this.hitFlash = Math.max(0, this.hitFlash - dt * 60);
        if (this.shieldActive && this.shieldHealth <= 0) {
          this.shieldActive = false;
        }
      }
    }

    // ===================================================================
    // GAME STATE
    // ===================================================================

    class Game {
      constructor() {
        this.state = "menu"; // menu, lobby, join, weaponSelect, playing, gameOver, stats
        this.running = true;
        this.player = null;
        this.enemies = [];
        this.bullets = [];
        this.pickups = [];
        this.particles = [];

        this.gameTimer = 0;
        this.wave = 1;
        this.currentMission = 0;
        this.missionProgress = 0;
        this.missionStarted = false;
        this.enemySpawnDelay = 50;

        this.partyCode = "";
        this.joinCode = "";
        this.selectedMapIdx = 0;
        this.mapName = MAPS[0].name;
        this.difficulty = 1;

        this.message = "";
        this.messageTimer = 0;

        this.keys = {};
        this.mouse = { x: WIDTH / 2, y: HEIGHT / 2, down: false };

        this.selectedWeaponSlot = "primary";
        this.selectedWeaponIdx = 0;

        this.fps = 0;
        this.frameCount = 0;
        this.lastFpsTime = Date.now();

        this.stats = {
          wavesSurvived: 0,
          killsTotal: 0,
          damageDealt: 0,
          damageReceived: 0,
          timeAlive: 0
        };
      }

      init() {
        this.player = new Player(WIDTH / 2, HEIGHT / 2, "Rook");
        this.enemies = [];
        this.bullets = [];
        this.pickups = [];
        this.particles = [];
        this.gameTimer = 0;
        this.wave = 1;
        this.currentMission = 0;
        this.missionProgress = 0;
        this.missionStarted = true;
        this.enemySpawnDelay = 50;
        this.message = "";
        this.messageTimer = 0;
        this.stats = { wavesSurvived: 0, killsTotal: 0, damageDealt: 0, damageReceived: 0, timeAlive: 0 };
        this.spawnWave();
      }

      setMessage(text, duration = 120) {
        this.message = text;
        this.messageTimer = duration;
      }

      spawnWave() {
        const count = Math.min(5 + this.wave * 2, 25 + this.difficulty * 5);
        for (let i = 0; i < count; i++) {
          const sides = ["top", "bottom", "left", "right"];
          const side = sides[Math.floor(Math.random() * sides.length)];
          let x = 0, y = 0;

          if (side === "top") {
            x = rand(0, WIDTH);
            y = -30;
          } else if (side === "bottom") {
            x = rand(0, WIDTH);
            y = HEIGHT + 30;
          } else if (side === "left") {
            x = -30;
            y = rand(0, HEIGHT);
          } else {
            x = WIDTH + 30;
            y = rand(0, HEIGHT);
          }

          const radius = rand(14, 20);
          const speed = rand(0.8, 1.5) + this.wave * 0.15 + this.difficulty * 0.1;
          const hp = rand(22, 34) + this.wave * 4 + this.difficulty * 3;
          const color = [
            randInt(100, 220),
            randInt(50, 120),
            randInt(50, 120)
          ];

          this.enemies.push(new Enemy(x, y, radius, speed, hp, color, this.wave));
        }
      }

      spawnPickup(x, y, kind) {
        this.pickups.push(new Pickup(x, y, kind));
      }

      spawnParticles(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = rand(1.0, 3.5);
          this.particles.push(new Particle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed, rand(18, 40), randInt(2, 5)));
        }
      }

      handleInput() {
        const moveX = (this.keys["KeyD"] || this.keys["ArrowRight"] ? 1 : 0) - (this.keys["KeyA"] || this.keys["ArrowLeft"] ? 1 : 0);
        const moveY = (this.keys["KeyS"] || this.keys["ArrowDown"] ? 1 : 0) - (this.keys["KeyW"] || this.keys["ArrowUp"] ? 1 : 0);

        this.player.move(moveX, moveY, 1 / 60);
        this.player.setAngleFromTarget(this.mouse.x, this.mouse.y);

        if (this.mouse.down || this.keys["Space"]) {
          this.player.shoot(this.bullets);
        }
        if (this.keys["ShiftLeft"] || this.keys["ShiftRight"]) {
          this.player.shootSecondary(this.bullets);
        }
        if (this.keys["KeyF"]) {
          this.player.meleeAttack(this.enemies);
        }
        if (this.keys["KeyQ"]) {
          this.player.useUtility(this.particles, this.enemies);
        }
      }

      update(dt) {
        if (this.state !== "playing") return;

        this.gameTimer += dt;
        this.stats.timeAlive = this.gameTimer;

        this.player.update(dt);
        this.handleInput();

        // Enemy spawn
        this.enemySpawnDelay = Math.max(0, this.enemySpawnDelay - dt * 60);
        if (this.enemySpawnDelay <= 0) {
          this.spawnWave();
          this.enemySpawnDelay = Math.max(20, 100 - this.wave * 4 - this.difficulty * 5);
          this.wave += 1;
        }

        // Update bullets
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const bullet = this.bullets[i];
          bullet.update(dt);

          if (!bullet.isAlive()) {
            this.bullets.splice(i, 1);
            continue;
          }

          let hitEnemy = false;
          for (let j = this.enemies.length - 1; j >= 0; j--) {
            const enemy = this.enemies[j];
            if (distance(bullet, enemy) < bullet.radius + enemy.radius) {
              enemy.takeDamage(bullet.damage);
              this.player.totalDamageDealt += bullet.damage;
              this.stats.damageDealt += bullet.damage;
              this.spawnParticles(bullet.x, bullet.y, bullet.color, 6);
              this.bullets.splice(i, 1);

              if (!enemy.isAlive()) {
                this.enemies.splice(j, 1);
                this.player.kills += 1;
                this.stats.killsTotal += 1;
                this.player.addXP(15);
                this.missionProgress += 1;
                if (Math.random() < 0.35) {
                  this.spawnPickup(enemy.x, enemy.y, "xp");
                }
                if (Math.random() < 0.10) {
                  this.spawnPickup(enemy.x, enemy.y, "key");
                }
              }
              hitEnemy = true;
              break;
            }
          }
        }

        // Update enemies
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const enemy = this.enemies[i];
          enemy.update(this.player, dt);

          if (distance(this.player, enemy) < enemy.radius + this.player.radius) {
            const damageAmount = 14;
            this.player.takeDamage(damageAmount);
            this.stats.damageReceived += damageAmount;
            enemy.hitFlash = 15;
            this.spawnParticles(this.player.x, this.player.y, COLORS.RED, 8);

            if (this.player.health <= 0) {
              this.state = "gameOver";
              this.setMessage("Mission failed.", 240);
            }

            if (!enemy.isAlive()) {
              this.enemies.splice(i, 1);
            }
          }
        }

        // Update pickups
        for (let i = this.pickups.length - 1; i >= 0; i--) {
          const pickup = this.pickups[i];
          pickup.update(dt);

          if (distance(this.player, pickup) < pickup.radius + this.player.radius + 8) {
            if (pickup.kind === "xp") {
              this.player.addXP(40);
              this.setMessage("+40 XP", 30);
            } else if (pickup.kind === "key") {
              this.player.keys += 1;
              this.setMessage("+1 key", 30);
            }
            this.pickups.splice(i, 1);
          }
        }

        // Update particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].update(dt);
          if (!this.particles[i].isAlive()) {
            this.particles.splice(i, 1);
          }
        }

        // Mission progression
        if (this.missionStarted && this.currentMission < MISSIONS.length) {
          const mission = MISSIONS[this.currentMission];
          let missionComplete = false;

          if (mission.type === "kills" && this.missionProgress >= mission.target) {
            missionComplete = true;
          } else if (mission.type === "time" && this.gameTimer >= mission.target) {
            missionComplete = true;
          } else if (mission.type === "survive" && this.gameTimer >= mission.target) {
            missionComplete = true;
          } else if (mission.type === "boss" && this.missionProgress >= mission.target) {
            missionComplete = true;
          }

          if (missionComplete) {
            this.completeMission(mission);
          }
        }

        // Spawn more enemies if none left
        if (this.enemies.length === 0 && this.state === "playing") {
          this.wave += 1;
          this.spawnWave();
        }

        // Update message timer
        if (this.messageTimer > 0) {
          this.messageTimer -= dt * 60;
          if (this.messageTimer <= 0) {
            this.message = "";
          }
        }

        // Update stats
        this.stats.wavesSurvived = this.wave;
      }

      completeMission(mission) {
        this.player.keys += mission.rewardKeys;
        this.player.addXP(mission.rewardXp);
        this.setMessage(`Mission complete: ${mission.title}`, 180);
        this.currentMission += 1;
        this.missionProgress = 0;
        this.missionStarted = this.currentMission < MISSIONS.length;
        this.wave += 1;
        this.spawnWave();
      }

      drawBackground() {
        ctx.fillStyle = rgb(COLORS.DARK);
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Grid
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        ctx.lineWidth = 1;
        for (let x = 0; x < WIDTH; x += 50) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, HEIGHT);
          ctx.stroke();
        }
        for (let y = 0; y < HEIGHT; y += 50) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }
      }

      drawMenu() {
        this.drawBackground();

        drawCenteredText("LAST LINE", WIDTH / 2, 110, COLORS.WHITE, 48, true);
        drawCenteredText("Tactical Coop Shooter", WIDTH / 2, 150, COLORS.LIGHT, 20);

        const lines = [
          "1. Create Party",
          "2. Join Party",
          "3. Start Solo Game",
          "",
          "CONTROLS:",
          "WASD - Move",
          "Mouse - Aim",
          "Left Click / Space - Shoot",
          "Shift - Secondary Fire",
          "F - Melee Attack",
          "Q - Use Utility",
          "ESC - Quit"
        ];

        let y = 220;
        for (const line of lines) {
          if (line === "") {
            y += 15;
            continue;
          }
          drawText(line, 300, y, line.startsWith("CONTROLS") ? COLORS.YELLOW : COLORS.LIGHT, 16);
          y += 28;
        }

        if (this.partyCode) {
          drawCenteredText(`Party Code: ${this.partyCode}`, WIDTH / 2, 580, COLORS.GREEN, 18, true);
        }

        if (this.message) {
          drawCenteredText(this.message, WIDTH / 2, 640, COLORS.YELLOW, 18);
        }
      }

      drawLobby() {
        this.drawBackground();

        drawCenteredText("LOBBY", WIDTH / 2, 60, COLORS.WHITE, 42, true);
        drawCenteredText(`Party Code: ${this.partyCode}`, WIDTH / 2, 120, COLORS.GREEN, 18);

        // Map selection
        drawText("Select Map (UP/DOWN):", 200, 180, COLORS.YELLOW, 18, true);

        for (let i = 0; i < MAPS.length; i++) {
          const map = MAPS[i];
          const isSelected = i === this.selectedMapIdx;
          const color = isSelected ? COLORS.GREEN : COLORS.LIGHT;
          const prefix = isSelected ? "> " : "  ";

          drawText(`${prefix}${i + 1}. ${map.name} (Unlock Lv${map.unlockLevel})`, 220, 220 + i * 32, color, 16);
          drawText(`      ${map.description}`, 240, 240 + i * 32, color, 13);
        }

        drawCenteredText("Press ENTER to deploy", WIDTH / 2, 650, COLORS.YELLOW, 16, true);
      }

      drawWeaponSelect() {
        this.drawBackground();

        drawCenteredText("SELECT LOADOUT", WIDTH / 2, 40, COLORS.WHITE, 36, true);

        const slots = ["primary", "secondary", "melee", "utility"];
        const slotNames = ["PRIMARY", "SECONDARY", "MELEE", "UTILITY"];

        let x = 50;
        for (let s = 0; s < slots.length; s++) {
          const slot = slots[s];
          const slotName = slotNames[s];
          const weapons = Object.keys(WEAPONS[slot]);

          drawText(slotName, x + 10, 100, this.selectedWeaponSlot === slot ? COLORS.YELLOW : COLORS.LIGHT, 14, true);

          for (let w = 0; w < weapons.length; w++) {
            const weapon = weapons[w];
            const isSelected = this.selectedWeaponSlot === slot && this.player.inventory[slot] === weapon;
            const color = isSelected ? COLORS.GREEN : COLORS.LIGHT;
            const prefix = isSelected ? "> " : "  ";

            drawText(`${prefix}${weapon}`, x + 10, 130 + w * 22, color, 12);
          }

          x += 300;
        }

        drawCenteredText("Click to select weapons | ENTER to start", WIDTH / 2, 680, COLORS.LIGHT, 14);
      }

      drawGame() {
        this.drawBackground();

        // Draw entities
        for (const bullet of this.bullets) bullet.draw();
        for (const pickup of this.pickups) pickup.draw();
        for (const enemy of this.enemies) enemy.draw();
        for (const p of this.particles) p.draw();

        this.player.draw();

        // HUD - Top left
        drawText(`HP: ${Math.floor(this.player.health)}/${this.player.maxHealth}`, 20, 25, COLORS.WHITE, 16);
        drawText(`LV ${this.player.level} • XP ${this.player.xp}/${getLevelThreshold(this.player.level)}`, 20, 50, COLORS.WHITE, 16);
        drawText(`Keys: ${this.player.keys} | Kills: ${this.player.kills}`, 20, 75, COLORS.YELLOW, 16);

        // HUD - Top right
        drawText(`Map: ${this.mapName}`, WIDTH - 280, 25, COLORS.LIGHT, 16);
        drawText(`Wave: ${this.wave}`, WIDTH - 280, 50, COLORS.LIGHT, 16);
        drawText(`Enemies: ${this.enemies.length}`, WIDTH - 280, 75, COLORS.LIGHT, 16);

        // Weapon info
        const primaryWeapon = WEAPONS.primary[this.player.inventory.primary];
        const secondaryWeapon = WEAPONS.secondary[this.player.inventory.secondary];
        drawText(`Primary: ${this.player.inventory.primary}`, 20, 100, COLORS.BLUE, 13);
        drawText(`Secondary: ${this.player.inventory.secondary}`, 20, 120, COLORS.BLUE, 13);

        // Mission
        if (this.currentMission < MISSIONS.length) {
          const mission = MISSIONS[this.currentMission];
          drawText(`Mission: ${mission.title}`, 20, HEIGHT - 95, COLORS.ORANGE, 16, true);
          drawText(`Progress: ${this.missionProgress}/${mission.target}`, 20, HEIGHT - 65, COLORS.LIGHT, 16);
        } else {
          drawCenteredText("All missions complete!", WIDTH / 2, HEIGHT - 80, COLORS.GREEN, 20, true);
        }

        if (this.message) {
          drawCenteredText(this.message, WIDTH / 2, HEIGHT - 30, COLORS.YELLOW, 16);
        }

        // FPS
        this.frameCount++;
        const now = Date.now();
        if (now - this.lastFpsTime >= 1000) {
          this.fps = this.frameCount;
          this.frameCount = 0;
          this.lastFpsTime = now;
        }
        drawText(`FPS: ${this.fps}`, WIDTH - 80, 15, COLORS.MID, 12);
      }

      drawGameOver() {
        this.drawBackground();

        drawCenteredText("MISSION FAILED", WIDTH / 2, 180, COLORS.RED, 48, true);

        drawCenteredText(`Final Wave: ${this.wave}`, WIDTH / 2, 260, COLORS.WHITE, 24);
        drawCenteredText(`Level: ${this.player.level}`, WIDTH / 2, 300, COLORS.WHITE, 24);
        drawCenteredText(`Kills: ${this.player.kills}`, WIDTH / 2, 340, COLORS.WHITE, 24);
        drawCenteredText(`Total Damage: ${Math.floor(this.stats.damageDealt)}`, WIDTH / 2, 380, COLORS.WHITE, 24);
        drawCenteredText(`Time Alive: ${Math.floor(this.gameTimer)}s`, WIDTH / 2, 420, COLORS.WHITE, 24);
        drawCenteredText(`Keys Earned: ${this.player.keys}`, WIDTH / 2, 460, COLORS.YELLOW, 24);

        drawCenteredText("Press R to restart or ESC to menu", WIDTH / 2, 540, COLORS.LIGHT, 16);
      }

      draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        if (this.state === "menu") this.drawMenu();
        else if (this.state === "lobby") this.drawLobby();
        else if (this.state === "weaponSelect") this.drawWeaponSelect();
        else if (this.state === "playing") this.drawGame();
        else if (this.state === "gameOver") this.drawGameOver();
      }
    }

    // ===================================================================
    // MAIN GAME LOOP
    // ===================================================================

    const game = new Game();

    // Input handlers
    window.addEventListener("keydown", (e) => {
      game.keys[e.code] = true;

      if (game.state === "menu" && e.code === "Enter") {
        game.state = "lobby";
        game.selectedMapIdx = 0;
        game.mapName = MAPS[0].name;
      } else if (game.state === "lobby") {
        if (e.code === "ArrowUp") {
          game.selectedMapIdx = Math.max(0, game.selectedMapIdx - 1);
          game.mapName = MAPS[game.selectedMapIdx].name;
          game.difficulty = MAPS[game.selectedMapIdx].difficulty;
        } else if (e.code === "ArrowDown") {
          game.selectedMapIdx = Math.min(MAPS.length - 1, game.selectedMapIdx + 1);
          game.mapName = MAPS[game.selectedMapIdx].name;
          game.difficulty = MAPS[game.selectedMapIdx].difficulty;
        } else if (e.code === "Enter") {
          game.state = "weaponSelect";
          game.init();
          game.state = "playing";
        }
      } else if (game.state === "gameOver") {
        if (e.code === "KeyR") {
          game.init();
          game.state = "playing";
        } else if (e.code === "Escape") {
          game.state = "menu";
        }
      } else if (game.state === "playing" && e.code === "Escape") {
        game.state = "menu";
      }
    });

    window.addEventListener("keyup", (e) => {
      game.keys[e.code] = false;
    });

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      game.mouse.x = (e.clientX - rect.left) * scaleX;
      game.mouse.y = (e.clientY - rect.top) * scaleY;
    });

    canvas.addEventListener("mousedown", () => {
      game.mouse.down = true;
    });

    window.addEventListener("mouseup", () => {
      game.mouse.down = false;
    });

    // Game loop
    let lastTime = 0;
    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.033);
      lastTime = timestamp;

      game.update(dt);
      game.draw();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
