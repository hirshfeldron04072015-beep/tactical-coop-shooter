<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last Line</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      background: #1b1d2a;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 20px rgba(59,130,246,0.3);
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const BLACK = [10, 10, 14];
    const DARK = [27, 28, 35];
    const MID = [54, 60, 74];
    const LIGHT = [195, 203, 216];
    const WHITE = [255, 255, 255];
    const RED = [214, 82, 82];
    const GREEN = [92, 192, 122];
    const BLUE = [101, 148, 250];
    const ORANGE = [255, 166, 77];
    const YELLOW = [240, 210, 90];
    const PURPLE = [162, 122, 255];

    const keys = {};
    const mouse = { x: WIDTH / 2, y: HEIGHT / 2, down: false };

    const MISSIONS = [
      { title: "Sweep the Gate", type: "kills", target: 12, rewardKeys: 3, rewardXp: 90 },
      { title: "Escort the Relic", type: "time", target: 35, rewardKeys: 5, rewardXp: 130 },
      { title: "Hunt the Warden", type: "boss", target: 1, rewardKeys: 7, rewardXp: 180 },
      { title: "Signal Recovery", type: "kills", target: 18, rewardKeys: 5, rewardXp: 140 },
      { title: "Last Stand", type: "survive", target: 50, rewardKeys: 8, rewardXp: 200 }
    ];

    function clamp(value, low, high) {
      return Math.max(low, Math.min(high, value));
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function rgb(arr) {
      return "rgb(" + arr[0] + "," + arr[1] + "," + arr[2] + ")";
    }

    function rect(x, y, w, h, color) {
      ctx.fillStyle = rgb(color);
      ctx.fillRect(x, y, w, h);
    }

    class Player {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 18;
        this.speed = 4.2;
        this.angle = 0;
        this.health = 100;
        this.maxHealth = 100;
        this.level = 1;
        this.xp = 0;
        this.keys = 0;
        this.fireCooldown = 0;
        this.meleeCooldown = 0;
        this.utilityCooldown = 0;
        this.hitFlash = 0;
        this.inventory = {
          primary: "Pulse Rifle",
          secondary: "Guardian Pistol",
          melee: "Combat Knife",
          utility: "Field Medkit"
        };
      }

      move(dx, dy, dt) {
        const length = Math.hypot(dx, dy);
        if (length > 0) {
          dx /= length;
          dy /= length;
        }
        this.x += dx * this.speed * dt * 60;
        this.y += dy * this.speed * dt * 60;
        this.x = clamp(this.x, this.radius, WIDTH - this.radius);
        this.y = clamp(this.y, this.radius, HEIGHT - this.radius);
      }

      setAngleFromTarget(tx, ty) {
        this.angle = Math.atan2(ty - this.y, tx - this.x);
      }

      shoot(bullets) {
        if (this.fireCooldown > 0) return;
        const damage = 14;
        const speed = 12;
        const color = BLUE;
        const spread = rand(-0.08, 0.08);
        const ang = this.angle + spread;
        const x = this.x + Math.cos(ang) * (this.radius + 10);
        const y = this.y + Math.sin(ang) * (this.radius + 10);
        bullets.push(new Bullet(x, y, ang, damage, speed, color));
        this.fireCooldown = 0.12 * 60;
      }

      shootSecondary(bullets) {
        if (this.fireCooldown > 0) return;
        const damage = 20;
        const speed = 14;
        const color = BLUE;
        const spread = rand(-0.04, 0.04);
        const ang = this.angle + spread;
        const x = this.x + Math.cos(ang) * (this.radius + 12);
        const y = this.y + Math.sin(ang) * (this.radius + 12);
        bullets.push(new Bullet(x, y, ang, damage, speed, color, 6));
        this.fireCooldown = 0.25 * 60;
      }

      meleeAttack(enemies) {
        if (this.meleeCooldown > 0) return;
        for (const enemy of enemies) {
          if (distance(this, enemy) < this.radius + enemy.radius + 28) {
            enemy.hp -= 32;
            enemy.hitFlash = 12;
            this.meleeCooldown = 0.52 * 60;
            return;
          }
        }
      }

      useUtility(particles) {
        if (this.utilityCooldown > 0) return;
        const kind = this.inventory.utility;
        if (kind === "Field Medkit") {
          this.health = Math.min(this.maxHealth, this.health + 28);
        } else if (kind === "Smoke Bomb") {
          for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = rand(1, 3);
            particles.push(new Particle(this.x, this.y, MID, Math.cos(angle) * speed, Math.sin(angle) * speed, 40, 4));
          }
        } else if (kind === "Shock Mine") {
          // simplified: damage nearby enemies
          for (const enemy of game.enemies) {
            if (distance(this, enemy) < 170) {
              enemy.hp -= 18;
              enemy.hitFlash = 14;
            }
          }
        } else if (kind === "Dash Core") {
          this.x += Math.cos(this.angle) * 55;
          this.y += Math.sin(this.angle) * 55;
          this.x = clamp(this.x, this.radius, WIDTH - this.radius);
          this.y = clamp(this.y, this.radius, HEIGHT - this.radius);
        }
        this.utilityCooldown = 220;
      }

      addXP(amount) {
        this.xp += amount;
        const threshold = 120 + (this.level - 1) * 80;
        while (this.xp >= threshold) {
          this.xp -= threshold;
          this.level += 1;
          this.maxHealth += 10;
          this.health = this.maxHealth;
          this.keys += 2;
        }
      }

      draw() {
        const color = this.hitFlash <= 0 ? BLUE : WHITE;
        // body
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(color);
        ctx.fill();

        // gun direction
        const gunX = this.x + Math.cos(this.angle) * (this.radius + 18);
        const gunY = this.y + Math.sin(this.angle) * (this.radius + 18);
        ctx.strokeStyle = rgb(LIGHT);
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(gunX, gunY);
        ctx.stroke();

        // health bar
        const barW = 60;
        const barH = 7;
        const bx = this.x - barW / 2;
        const by = this.y + this.radius + 12;
        rect(bx, by, barW, barH, BLACK);
        rect(bx, by, barW * clamp(this.health / this.maxHealth, 0, 1), barH, GREEN);
      }
    }

    class Bullet {
      constructor(x, y, angle, damage, speed, color, radius = 5, life = 90) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.damage = damage;
        this.speed = speed;
        this.color = color;
        this.radius = radius;
        this.life = life;
      }

      update(dt) {
        this.x += Math.cos(this.angle) * this.speed * dt * 60;
        this.y += Math.sin(this.angle) * this.speed * dt * 60;
        this.life -= dt * 60;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(this.color);
        ctx.fill();
      }
    }

    class Enemy {
      constructor(x, y, radius, speed, hp, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.speed = speed;
        this.hp = hp;
        this.maxHp = hp;
        this.color = color;
        this.hitFlash = 0;
      }

      update(target, dt) {
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const d = Math.max(1, Math.hypot(dx, dy));
        this.x += (dx / d) * this.speed * dt * 60;
        this.y += (dy / d) * this.speed * dt * 60;
        this.hitFlash = Math.max(0, this.hitFlash - dt * 60);
      }

      draw() {
        let color = this.color;
        if (this.hitFlash > 0) color = WHITE;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(color);
        ctx.fill();

        const barW = this.radius * 2;
        const barH = 5;
        rect(this.x - this.radius, this.y - this.radius - 12, barW, barH, BLACK);
        rect(this.x - this.radius, this.y - this.radius - 12, barW * clamp(this.hp / this.maxHp, 0, 1), barH, RED);
      }
    }

    class Pickup {
      constructor(x, y, kind) {
        this.x = x;
        this.y = y;
        this.kind = kind;
        this.radius = 10;
        this.phase = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.phase += dt * 3;
      }

      draw() {
        const color = this.kind === "xp" ? GREEN : this.kind === "key" ? YELLOW : BLUE;
        const bob = Math.sin(this.phase) * 4;

        ctx.beginPath();
        ctx.arc(this.x, this.y + bob, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgb(color);
        ctx.fill();
      }
    }

    class Particle {
      constructor(x, y, color, vx, vy, life, size = 3) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.size = size;
      }

      update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.life -= dt * 60;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = rgb(this.color);
        ctx.fill();
      }
    }

    class Game {
      constructor() {
        this.state = "menu";
        this.player = new Player(WIDTH / 2, HEIGHT / 2);
        this.enemies = [];
        this.bullets = [];
        this.pickups = [];
        this.particles = [];
        this.wave = 1;
        this.gameTimer = 0;
        this.currentMission = 0;
        this.missionProgress = 0;
        this.missionStarted = false;
        this.message = "";
        this.messageTimer = 0;
        this.enemySpawnDelay = 50;
      }

      setMessage(text, duration = 120) {
        this.message = text;
        this.messageTimer = duration;
      }

      startGame() {
        this.state = "playing";
        this.wave = 1;
        this.enemies = [];
        this.bullets = [];
        this.pickups = [];
        this.particles = [];
        this.player = new Player(WIDTH / 2, HEIGHT / 2);
        this.gameTimer = 0;
        this.currentMission = 0;
        this.missionProgress = 0;
        this.missionStarted = true;
        this.enemySpawnDelay = 50;
        this.spawnWave();
      }

      spawnWave() {
        const count = Math.min(5 + this.wave * 2, 20);
        for (let i = 0; i < count; i++) {
          const side = ["top", "bottom", "left", "right"][Math.floor(Math.random() * 4)];
          let x = 0, y = 0;
          if (side === "top") {
            x = rand(0, WIDTH);
            y = -30;
          } else if (side === "bottom") {
            x = rand(0, WIDTH);
            y = HEIGHT + 30;
          } else if (side === "left") {
            x = -30;
            y = rand(0, HEIGHT);
          } else {
            x = WIDTH + 30;
            y = rand(0, HEIGHT);
          }

          const radius = rand(14, 20);
          const speed = rand(0.8, 1.5) + this.wave * 0.15;
          const hp = rand(22, 34) + this.wave * 4;
          const color = [
            rand(100, 220),
            rand(50, 120),
            rand(50, 120)
          ];
          this.enemies.push(new Enemy(x, y, radius, speed, hp, color));
        }
      }

      spawnPickup(x, y, kind) {
        this.pickups.push(new Pickup(x, y, kind));
      }

      spawnParticles(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = rand(1, 3.5);
          this.particles.push(new Particle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed, rand(18, 40), rand(2, 5)));
        }
      }

      update(dt) {
        this.gameTimer += dt;

        this.player.fireCooldown = Math.max(0, this.player.fireCooldown - dt * 60);
        this.player.meleeCooldown = Math.max(0, this.player.meleeCooldown - dt * 60);
        this.player.utilityCooldown = Math.max(0, this.player.utilityCooldown - dt * 60);
        this.player.hitFlash = Math.max(0, this.player.hitFlash - dt * 60);

        // movement
        const moveX = (keys["KeyD"] || keys["ArrowRight"] ? 1 : 0) - (keys["KeyA"] || keys["ArrowLeft"] ? 1 : 0);
        const moveY = (keys["KeyS"] || keys["ArrowDown"] ? 1 : 0) - (keys["KeyW"] || keys["ArrowUp"] ? 1 : 0);
        this.player.move(moveX, moveY, dt);

        // aim
        this.player.setAngleFromTarget(mouse.x, mouse.y);

        // shooting
        if (mouse.down || keys["Space"]) {
          this.player.shoot(this.bullets);
        }
        if (keys["ShiftLeft"] || keys["ShiftRight"]) {
          this.player.shootSecondary(this.bullets);
        }
        if (keys["KeyF"]) {
          this.player.meleeAttack(this.enemies);
        }
        if (keys["KeyQ"]) {
          this.player.useUtility(this.particles);
        }

        // enemy spawn
        this.enemySpawnDelay = Math.max(0, this.enemySpawnDelay - dt * 60);
        if (this.enemySpawnDelay <= 0) {
          this.spawnWave();
          this.enemySpawnDelay = Math.max(20, 100 - this.wave * 4);
          this.wave += 1;
        }

        // bullet update
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const bullet = this.bullets[i];
          bullet.update(dt);

          if (bullet.life <= 0 || bullet.x < -20 || bullet.x > WIDTH + 20 || bullet.y < -20 || bullet.y > HEIGHT + 20) {
            this.bullets.splice(i, 1);
            continue;
          }

          let hitEnemy = false;
          for (let j = this.enemies.length - 1; j >= 0; j--) {
            const enemy = this.enemies[j];
            if (distance(bullet, enemy) < bullet.radius + enemy.radius) {
              enemy.hp -= bullet.damage;
              enemy.hitFlash = 10;
              this.spawnParticles(bullet.x, bullet.y, bullet.color, 6);
              this.bullets.splice(i, 1);
              if (enemy.hp <= 0) {
                this.enemies.splice(j, 1);
                this.player.addXP(15);
                this.missionProgress += 1;
                if (Math.random() < 0.35) {
                  this.spawnPickup(enemy.x, enemy.y, "xp");
                }
                if (Math.random() < 0.10) {
                  this.spawnPickup(enemy.x, enemy.y, "key");
                }
              }
              hitEnemy = true;
              break;
            }
          }

          if (hitEnemy) continue;
        }

        // enemy update
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const enemy = this.enemies[i];
          enemy.update(this.player, dt);

          if (distance(this.player, enemy) < enemy.radius + this.player.radius) {
            this.player.health -= 14;
            this.player.hitFlash = 15;
            enemy.hitFlash = 15;
            this.spawnParticles(this.player.x, this.player.y, RED, 8);

            if (this.player.health <= 0) {
              this.state = "game_over";
              this.setMessage("Mission failed.", 240);
            }

            if (enemy.hp <= 0) {
              this.enemies.splice(i, 1);
            }
          }
        }

        // pickups
        for (let i = this.pickups.length - 1; i >= 0; i--) {
          const pickup = this.pickups[i];
          pickup.update(dt);

          if (distance(this.player, pickup) < pickup.radius + this.player.radius + 8) {
            if (pickup.kind === "xp") {
              this.player.addXP(40);
              this.setMessage("+40 XP", 30);
            } else if (pickup.kind === "key") {
              this.player.keys += 1;
              this.setMessage("+1 key", 30);
            }
            this.pickups.splice(i, 1);
          }
        }

        // particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].update(dt);
          if (this.particles[i].life <= 0) {
            this.particles.splice(i, 1);
          }
        }

        // mission progression
        if (this.missionStarted && this.currentMission < MISSIONS.length) {
          const mission = MISSIONS[this.currentMission];
          if (mission.type === "kills") {
            if (this.missionProgress >= mission.target) {
              this.completeMission(mission);
            }
          } else if (mission.type === "time") {
            if (this.gameTimer >= mission.target) {
              this.completeMission(mission);
            }
          } else if (mission.type === "survive") {
            if (this.gameTimer >= mission.target) {
              this.completeMission(mission);
            }
          } else if (mission.type === "boss") {
            if (this.missionProgress >= mission.target) {
              this.completeMission(mission);
            }
          }
        }

        // if no enemies left, spawn more
        if (this.enemies.length === 0 && this.state === "playing") {
          this.wave += 1;
          this.spawnWave();
        }

        if (this.messageTimer > 0) {
          this.messageTimer -= dt * 60;
          if (this.messageTimer <= 0) {
            this.message = "";
          }
        }
      }

      completeMission(mission) {
        this.player.keys += mission.rewardKeys;
        this.player.addXP(mission.rewardXp);
        this.setMessage(`Mission complete: ${mission.title}`, 180);
        this.currentMission += 1;
        this.missionProgress = 0;
        this.missionStarted = this.currentMission < MISSIONS.length;
        this.wave += 1;
        this.spawnWave();
      }

      drawBackground() {
        ctx.fillStyle = rgb(DARK);
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // grid
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        ctx.lineWidth = 1;
        for (let x = 0; x < WIDTH; x += 50) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, HEIGHT);
          ctx.stroke();
        }
        for (let y = 0; y < HEIGHT; y += 50) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }
      }

      drawMenu() {
        this.drawBackground();

        ctx.fillStyle = rgb(WHITE);
        ctx.font = "bold 42px Arial";
        ctx.textAlign = "center";
        ctx.fillText("LAST LINE", WIDTH / 2, 110);

        const lines = [
          "Press Enter to start",
          "",
          "Controls:",
          "WASD move",
          "Mouse aim",
          "Left click / Space shoot",
          "Shift secondary fire",
          "F melee",
          "Q utility",
          "Esc quit"
        ];

        ctx.textAlign = "left";
        ctx.font = "22px Arial";
        let y = 200;
        for (const line of lines) {
          ctx.fillStyle = rgb(LIGHT);
          ctx.fillText(line, 240, y);
          y += 35;
        }

        if (this.message) {
          ctx.font = "22px Arial";
          ctx.fillStyle = rgb(YELLOW);
          ctx.fillText(this.message, 240, 610);
        }
      }

      drawGame() {
        this.drawBackground();

        // Draw bullets
        for (const bullet of this.bullets) bullet.draw();
        for (const pickup of this.pickups) pickup.draw();
        for (const enemy of this.enemies) enemy.draw();
        for (const p of this.particles) p.draw();

        this.player.draw();

        // HUD
        ctx.font = "20px Arial";
        ctx.fillStyle = rgb(WHITE);
        ctx.fillText(`HP: ${Math.floor(this.player.health)}/${this.player.maxHealth}`, 20, 20);
        ctx.fillText(`LV ${this.player.level} • XP ${this.player.xp}/${120 + (this.player.level - 1) * 80}`, 20, 50);
        ctx.fillText(`Keys: ${this.player.keys}`, 20, 80);

        ctx.fillStyle = rgb(LIGHT);
        ctx.fillText(`Map: Rift District`, WIDTH - 260, 20);
        ctx.fillText(`Wave: ${this.wave}`, WIDTH - 260, 50);

        if (this.currentMission < MISSIONS.length) {
          const mission = MISSIONS[this.currentMission];
          ctx.fillStyle = rgb(ORANGE);
          ctx.fillText(`Mission: ${mission.title}`, 20, HEIGHT - 90);
          ctx.fillStyle = rgb(LIGHT);
          ctx.fillText(`Progress: ${this.missionProgress}/${mission.target}`, 20, HEIGHT - 60);
        } else {
          ctx.fillStyle = rgb(GREEN);
          ctx.font = "bold 28px Arial";
          ctx.fillText("All missions complete", WIDTH / 2 - 150, HEIGHT - 90);
        }

        if (this.message) {
          ctx.font = "20px Arial";
          ctx.fillStyle = rgb(YELLOW);
          ctx.fillText(this.message, WIDTH / 2 - 110, HEIGHT - 35);
        }
      }

      drawGameOver() {
        this.drawBackground();

        ctx.font = "bold 42px Arial";
        ctx.fillStyle = rgb(RED);
        ctx.textAlign = "center";
        ctx.fillText("MISSION FAILED", WIDTH / 2, 220);

        ctx.font = "28px Arial";
        ctx.fillStyle = rgb(WHITE);
        ctx.fillText(`Level: ${this.player.level} | Keys: ${this.player.keys} | XP: ${this.player.xp}`, WIDTH / 2, 300);

        ctx.font = "22px Arial";
        ctx.fillStyle = rgb(LIGHT);
        ctx.fillText("Press R to restart or Esc to menu", WIDTH / 2, 350);

        ctx.textAlign = "left";
      }

      draw() {
        if (this.state === "menu") this.drawMenu();
        else if (this.state === "playing") this.drawGame();
        else if (this.state === "game_over") this.drawGameOver();
      }
    }

    const game = new Game();

    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "Enter" && game.state === "menu") {
        game.startGame();
      }
      if (e.code === "Escape") {
        if (game.state === "game_over") {
          game.state = "menu";
        }
      }
      if (e.code === "KeyR" && game.state === "game_over") {
        game.startGame();
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * WIDTH;
      mouse.y = ((e.clientY - rect.top) / rect.height) * HEIGHT;
    });

    canvas.addEventListener("mousedown", () => {
      mouse.down = true;
    });

    window.addEventListener("mouseup", () => {
      mouse.down = false;
    });

    let lastTime = 0;
    function loop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.033);
      lastTime = timestamp;

      if (game.state === "playing") {
        game.update(dt);
      }

      game.draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
